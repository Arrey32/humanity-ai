services:
  - type: web
    name: humanity-ai
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: AUTH_REQUIRED
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: ./data/humanity_ai.db
      - key: STORE_CONVERSATIONS
        value: "false"
      - key: MODEL_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: MODEL_NAME
        value: gemini-3.8-flash
      - key: MODEL_API_KEY
        sync: false
